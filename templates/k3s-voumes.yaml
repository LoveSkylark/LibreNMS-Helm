---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: "{{ .Release.Name }}-database"
  labels:
{{ include "common.labels" . | indent 4 }}
    type: storage
spec:
  storageClassName: ""
  capacity:
    storage: {{ .Values.mariadb.host.volumeSize }}
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: {{ printf "%s/%s/database" (trimSuffix "/" .Values.storage.path) .Release.Name | quote }}

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: "{{ .Release.Name }}-application"
  labels:
{{ include "common.labels" . | indent 4 }}
    type: storage
spec:
  storageClassName: ""
  capacity:
    storage: {{ .Values.application.host.volumeSize }}
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: {{ printf "%s/%s/application" (trimSuffix "/" .Values.storage.path) .Release.Name | quote }}
