---
{{- $tlsSecretName := default .Values.ingress.tls.secretName .Values.ingress.tls.existingSecretName }}
{{- $issuerKind := default "ClusterIssuer" .Values.ingress.letsEncrypt.issuerKind }}
{{- $issuerName := default "letsencrypt-prod" .Values.ingress.letsEncrypt.issuerName }}
{{- $smokepingHost := default "" .Values.smokeping.host.FQDN }}
{{- $oxidizedHost := default "" .Values.oxidized.host.FQDN }}
{{- $includeSmokepingIngress := and .Values.smokeping.enable (ne $smokepingHost "") }}
{{- $includeOxidizedIngress := and .Values.oxidized.enable (ne $oxidizedHost "") }}
{{- $traefikMiddlewareAnnotationPrefix := "" }}
{{- $includeIpCatchAll := .Values.ingress.ipCatchAll.enabled }}
{{- if .Capabilities.APIVersions.Has "traefik.io/v1alpha1/Middleware" }}
{{- $traefikMiddlewareAnnotationPrefix = "@kubernetescrd" }}
{{- else if .Capabilities.APIVersions.Has "traefik.containo.us/v1alpha1/Middleware" }}
{{- $traefikMiddlewareAnnotationPrefix = "@kubernetescrd" }}
{{- end }}
{{- $hasTraefikMiddlewareCrd := ne $traefikMiddlewareAnnotationPrefix "" }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "{{ .Release.Name }}-application"
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "common.labels" . | indent 4 }}
  annotations:
{{- if .Values.ingress.https }}  
{{- if .Values.ingress.redirectToHttps.enabled }}
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
{{- if $hasTraefikMiddlewareCrd }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-%s@kubernetescrd,%s-%s@kubernetescrd" .Release.Namespace (printf "%s-https-redirect" .Release.Name) .Release.Namespace (printf "%s-forwarded-proto-https" .Release.Name) | quote }}
{{- end }}
{{- else }}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
{{- if $hasTraefikMiddlewareCrd }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-%s@kubernetescrd" .Release.Namespace (printf "%s-forwarded-proto-https" .Release.Name) | quote }}
{{- end }}
{{- end }}
    traefik.ingress.kubernetes.io/router.tls: "true"
{{- else }}
    traefik.ingress.kubernetes.io/router.entrypoints: web
{{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  rules:
  - host: {{ .Values.application.host.FQDN | quote }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Values.application.host.name }}
            port:
              number: 8000
{{- if $includeSmokepingIngress }}
  - host: {{ $smokepingHost | quote }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: smokeping
            port:
              number: 8081
{{- end }}
{{- if $includeOxidizedIngress }}
  - host: {{ $oxidizedHost | quote }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: oxidized
            port:
              number: 8888
{{- end }}
{{- if .Values.ingress.https }}  
  tls:
  - hosts:
    - {{ .Values.application.host.FQDN }}
  {{- if $includeSmokepingIngress }}
    - {{ $smokepingHost }}
{{- end }}
  {{- if $includeOxidizedIngress }}
    - {{ $oxidizedHost }}
{{- end }}
    secretName: {{ $tlsSecretName | quote }}
{{- end }}

{{- if and $includeIpCatchAll $hasTraefikMiddlewareCrd }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: "{{ .Release.Name }}-catch-all"
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "common.labels" . | indent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-%s@kubernetescrd" .Release.Namespace (printf "%s-catch-all-host-redirect" .Release.Name) | quote }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ .Values.application.host.name }}
            port:
              number: 8000
{{- end }}

---
{{- if .Values.application.syslogng.enable }}
apiVersion: v1
kind: Service
metadata:
  name: "{{ .Release.Name }}-syslog-tcp"
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "common.labels" . | indent 4 }}
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: {{ .Values.application.syslogng.name | quote }}
  ports:
    - name: syslog-tcp
      protocol: TCP
      port: 514
      targetPort: syslog-tcp

---
apiVersion: v1
kind: Service
metadata:
  name: "{{ .Release.Name }}-syslog-udp"
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "common.labels" . | indent 4 }}
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: {{ .Values.application.syslogng.name | quote }}
  ports:
    - name: syslog-udp
      protocol: UDP
      port: 514
      targetPort: syslog-udp
{{- end }}

---
{{- if .Values.application.trap.enable }}
apiVersion: v1
kind: Service
metadata:
  name: "{{ .Release.Name }}-trap-tcp"
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "common.labels" . | indent 4 }}
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: {{ .Values.application.trap.name | quote }}
  ports:
    - name: trap-tcp
      protocol: TCP
      port: 162
      targetPort: trap-tcp

---
apiVersion: v1
kind: Service
metadata:
  name: "{{ .Release.Name }}-trap-udp"
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "common.labels" . | indent 4 }}
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: {{ .Values.application.trap.name | quote }}
  ports:
    - name: trap-udp
      protocol: UDP
      port: 162
      targetPort: trap-udp
{{- end }}


