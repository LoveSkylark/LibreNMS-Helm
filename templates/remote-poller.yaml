---
apiVersion: v1
kind: Service
metadata:
  name: "{{ .Release.Name }}-mysql"
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "common.labels" . | indent 4 }}
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
{{- if not .Values.remotePoller.allowFromAnywhere }}
  loadBalancerSourceRanges: {{ .Values.remotePoller.allowedSourceRanges | toJson }}
{{- end }}
  selector:
    app: {{ .Values.mariadb.host.name | quote }}
  ports:
    - name: mysql-lb
      protocol: TCP
      port: 3306
      targetPort: mysql

