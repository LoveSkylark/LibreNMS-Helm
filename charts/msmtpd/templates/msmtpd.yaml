---
{{- if .Values.enable }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.host.name | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "common.labels" . | indent 4 }}
    app: {{ .Values.host.name | quote }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.host.name | quote }}
  ports:
    - name: smtp
      protocol: TCP
      port: 2500
      targetPort: smtp

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.host.name | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
{{ include "common.labels" . | indent 4 }}
    app: {{ .Values.host.name | quote }}
spec:
  serviceName: {{ .Values.host.name | quote }}
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.host.name | quote }}
  template:
    metadata:
      labels:
        app: {{ .Values.host.name | quote }}
    spec:
      restartPolicy: Always
      hostNetwork: {{ .Values.network.hostNetwork }}
      dnsPolicy: {{ ternary "ClusterFirstWithHostNet" "ClusterFirst" .Values.network.hostNetwork | quote }}
{{- if .Values.scheduling.nodeName }}
      nodeName: {{ .Values.scheduling.nodeName | quote }}
{{- end }}
      containers:
        - name: {{ .Values.host.name | quote }}
          image: "{{.Values.image}}"
          ports:
            - name: smtp
              containerPort: 2500
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ .Values.host.name | quote }}
          env:
            - name: SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: msmtpd-sec
                  key: email_user
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: msmtpd-sec
                  key: email_password
{{- end }}
